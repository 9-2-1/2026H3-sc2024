[pytest]
# 在仓库根目录直接执行 `pytest` 即可跑完全部用例。
# 只收 tests/ 下的 test_*.py —— 根目录的 test.py 是赛事提供的仿真演示脚本
# （会拉起 PyBullet 图形界面），不属于测试用例，必须排除在外。
testpaths = tests
python_files = test_*.py

addopts = -v --no-header -p no:cacheprovider

# 交付模块标记：pytest -m module1 / -m module2 可分组执行
markers =
    module1: 模块一（测试基础实践）的用例，34 条人工设计的黑盒用例
    module2: 模块二（AI 融合实践）的用例，20 条 AI 扩展生成的进阶用例
